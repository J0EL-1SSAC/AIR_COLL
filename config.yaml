airport:
  icao: VOMM
  latitude: 12.9941
  longitude: 80.1709
  radius_nm: 40

opensky:
  token_url: https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token
  api_url: https://opensky-network.org/api/states/all
  request_timeout_s: 20
  daily_credit_quota: 4000
  estimated_credits_per_states_request: 1

collector:
  poll_interval_s: 30
  max_backoff_s: 300
  sparse_count_threshold: 3
  low_altitude_ft: 1000

state_manager:
  history_length: 40
  low_quality_after_s: 45
  drop_after_s: 180
  tombstone_s: 300
  smoothing_enabled: false
  alpha: 0.75
  beta: 0.08

storage:
  database_path: data/airwatch.db
  batch_size: 250
  flush_interval_s: 2

coverage:
  window_s: 1800
  bucket_s: 60

replay:
  default_speed: 10
  min_speed: 1
  max_speed: 60
  speed_steps: [1, 5, 10, 30, 60]
  queue_size: 8

# Research/demo thresholds, NOT official ATC separation standards.
risk:
  active_profile: research_default
  min_alert_level: MEDIUM
  allow_low_watch: false
  lookahead_s: 60
  max_data_age_for_alert_s: 75
  treat_unknown_vertical_as: conservative # conservative | skip | downgrade_one_level
  filters:
    ignore_both_on_ground: true
    ignore_diverging: true
    ignore_beyond_lookahead: true
    ignore_old_data: true
  confirmation:
    confirm_cycles: 2
    confirm_min_seconds: 30
  clear:
    clear_below_level: MEDIUM
    clear_cycles: 2
    clear_min_seconds: 30
  cooldown_s: 300
  data_lost_timeout_s: 90
  confidence:
    high_max_age_s: 15
    high_max_uncertainty_m: 250
    medium_max_age_s: 45
    medium_max_uncertainty_m: 750
  profiles:
    research_default:
      levels:
        LOW: {max_horizontal_separation_m: 3000, max_vertical_separation_m: 900, max_time_to_cpa_s: 120}
        MEDIUM: {max_horizontal_separation_m: 1852, max_vertical_separation_m: 600, max_time_to_cpa_s: 90}
        HIGH: {max_horizontal_separation_m: 926, max_vertical_separation_m: 300, max_time_to_cpa_s: 60}
        CRITICAL: {max_horizontal_separation_m: 463, max_vertical_separation_m: 150, max_time_to_cpa_s: 30}
      uncertainty_factor: 1.0
      adjustments:
        closing_speed_escalation_mps: 100
        closing_speed_raise_levels: 1
        poor_data_age_s: 60
        downgrade_poor_data: true
        poor_data_quality_flags: [LOW_QUALITY, stale_position, position_timestamp_missing]
      in_trail:
        enabled: true
        max_track_difference_deg: 20
        min_lateral_offset_m: 1500
        downgrade_levels: 1
    sensitive_test:
      levels:
        LOW: {max_horizontal_separation_m: 22000, max_vertical_separation_m: 12000, max_time_to_cpa_s: 120}
        MEDIUM: {max_horizontal_separation_m: 18000, max_vertical_separation_m: 10000, max_time_to_cpa_s: 120}
        HIGH: {max_horizontal_separation_m: 14000, max_vertical_separation_m: 8000, max_time_to_cpa_s: 90}
        CRITICAL: {max_horizontal_separation_m: 10000, max_vertical_separation_m: 6000, max_time_to_cpa_s: 60}
      uncertainty_factor: 0.0
      adjustments:
        closing_speed_escalation_mps: 80
        closing_speed_raise_levels: 1
        poor_data_age_s: 70
        downgrade_poor_data: false
        poor_data_quality_flags: [LOW_QUALITY, stale_position, position_timestamp_missing]
      in_trail:
        enabled: false
        max_track_difference_deg: 30
        min_lateral_offset_m: 1000
        downgrade_levels: 1

prediction:
  model: constant_velocity
  horizons_s: [5, 10, 20, 30, 60]
  ground_elevation_m: 16.4592
  max_data_age_s: 45
  skip_on_ground: true
  skip_low_quality: true
  skip_stale: true
  uncertainty:
    base_position_error_m: 30
    speed_error_mps: 1.5
    age_error_m_per_s: 0.5

cpa:
  lookahead_s: 60
  horizontal_cutoff_nm: 12
  altitude_band_ft: 5000
  relative_speed_epsilon_mps: 0.1
  position_epsilon_m: 0.01
  altitude_basis_policy: common_geometric_then_barometric
  minimum_data_quality: not_low_quality
  uncertainty_combination: root_sum_square
  display_near_nm: 1.5
  display_amber_nm: 3.0

api:
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

web:
  map_zoom: 9
  stale_after_s: 180
  altitude_bands_m:
    low_max: 304.8
    medium_max: 3048
  runway_ring_step_deg: 5
  age_refresh_s: 1
  reconnect_initial_ms: 1000
  reconnect_max_ms: 15000
  labels_min_zoom: 11
  label_exclusion_nm: 2
  prediction_ticks_min_zoom: 11
  trail_oldest_opacity: 0.18
  trail_newest_opacity: 0.82

runways:
  data_file: data/runways.csv
  override_file: data/runways_override.yaml
  include_closed: false
  default_width_m: 45
  # User-supplied Chennai WMM2025 declination, checked 2026-10-04: -1°4' = -1.0666667° (west).
  # Recheck against the effective official AIP/aerodrome chart before operational interpretation.
  # East variation is positive; true heading = magnetic heading + variation.
  magnetic_variation_deg: -1.0666667
  magnetic_variation_confirmed: true
  heading_tolerance_deg: 12
  max_threshold_distance_from_airport_m: 12000
  length_tolerance_m: 150
  buffer_lateral_m: 60
  buffer_longitudinal_m: 90
  approach_length_nm: 5
  centerline_extension_nm: 1
  corridor_half_width_threshold_m: 900
  corridor_half_width_far_m: 2500
  approach_altitude_ceiling_m: 1500

frequencies:
  data_file: data/airport-frequencies.csv
  override_file: data/frequencies_override.yaml
  departure_fallback_type: APP

radio_estimate:
  short_final_distance_nm: 1.5
  departure_climb_min_fpm: 500
  departure_distance_nm: 5
  departure_max_altitude_ft: 3000
  departure_fallback_type: APP
  require_aip_verification: true

airport_reference:
  data_file: data/airports.csv
  database_file: data/airport_reference.db

enrichment:
  enabled: true
  airlines_file: data/airlines.dat
  base_url: https://api.adsbdb.com/v0
  timeout_s: 5
  max_requests_per_window: 30
  rate_window_s: 60
  callsign_ttl_s: 21600
  aircraft_ttl_s: 86400
  failure_backoff_s: 300
  eta_uncertainty_fraction: 0.2

# Live aviation weather from AviationWeather.gov Data API. METAR and TAF are
# separate products with different update rates; missing/failed products stay unavailable.
weather:
  provider: AviationWeather.gov Data API
  metar_url: https://aviationweather.gov/api/data/metar
  taf_url: https://aviationweather.gov/api/data/taf
  refresh_interval_s: 60
  taf_refresh_interval_s: 600
  request_timeout_s: 15
  max_metar_age_s: 3600
  user_agent: AIR_COL research prototype (local use)

# Approach and occupancy estimates are research observations, not operational classifications.
approach:
  max_heading_diff_deg: 15
  closing_window_s: 60
  min_closing_samples: 2
  min_closing_distance_m: 100
  max_vertical_rate_fpm: 500
  min_glide_angle_deg: 1.0
  max_glide_angle_deg: 6.0
  min_speed_kt: 60
  max_speed_kt: 220
  max_data_age_s: 75
  confirm_s: 20
  near_threshold_distance_m: 1500
  clear_hysteresis_s: 30
  lost_timeout_s: 90
  restart_after_s: 300
  go_around_climb_fpm: 500
  runway_in_use_window_min: 20
  runway_in_use_min_approaches: 2
  speed_uncertainty_mps: 8
  age_distance_uncertainty_mps: 8
  confidence_min_samples_medium: 3
  confidence_min_samples_high: 5

airport_activity:
  landing_inference_max_distance_nm: 5
  landing_inference_max_height_ft: 1500
  min_samples: 2
  medium_confidence_min_samples: 3
  high_confidence_min_samples: 5
  max_heading_diff_deg: 15
  departure_min_samples: 2
  departure_min_climb_fpm: 500
  departure_max_distance_nm: 1.5
  departure_max_height_ft: 3000
  inferred_display_s: 600
  runway_badge_limit: 3

occupancy:
  enabled: true
  ground_elevation_m: 16.4592
  min_persistence_s: 30
  min_consistent_samples: 2
  max_data_age_s: 75
  ghost_ttl_s: 120
  ground_altitude_tolerance_m: 15
  max_ground_speed_mps: 25
  alignment_tolerance_deg: 20
  crossing_min_angle_deg: 55
  # Gate uses measured coverage report rates for received reports inside the runway buffer.
  minimum_low_altitude_buffer_reports_per_hour: 5
  minimum_on_ground_buffer_reports_per_hour: 5
  minimum_recording_hours: 6

replay_ui:
  session_gap_s: 300
  cycles_page_size: 200

coverage_report:
  output_dir: reports/coverage
  ground_elevation_m: 16.4592
  max_poll_gap_s: 90
  max_track_gap_s: 180
  minimum_track_reports: 3
  altitude_bands_ft: [[0, 500, "0-500 ft"], [500, 1000, "500-1,000 ft"], [1000, 2000, "1,000-2,000 ft"], [2000, 3000, "2,000-3,000 ft"], [3000, 5000, "3,000-5,000 ft"], [5000, null, "above 5,000 ft"]]
  distance_rings_nm: [[0, 2, "0-2 NM"], [2, 5, "2-5 NM"], [5, 10, "5-10 NM"], [10, 20, "10-20 NM"], [20, 40, "20-40 NM"]]
  approach_altitude_ceiling_m: 457.2 # 1,500 ft above airport level
  runway_buffer_low_altitude_ft: 1000
  feasibility:
    minimum_recording_hours: 6
    minimum_low_altitude_reports_per_hour: 10
    minimum_ground_reports_per_hour: 10
    minimum_runway_buffer_reports_per_hour: 5
