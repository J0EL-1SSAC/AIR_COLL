airport:
  icao: VOMM
  latitude: 12.9941
  longitude: 80.1709
  radius_nm: 40

opensky:
  token_url: https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token
  api_url: https://opensky-network.org/api/states/all
  request_timeout_s: 20
  daily_credit_quota: 4000
  estimated_credits_per_states_request: 1

collector:
  poll_interval_s: 30
  max_backoff_s: 300
  sparse_count_threshold: 3
  low_altitude_ft: 1000

state_manager:
  history_length: 40
  low_quality_after_s: 45
  drop_after_s: 180
  tombstone_s: 300
  smoothing_enabled: false
  alpha: 0.75
  beta: 0.08

storage:
  database_path: data/airwatch.db
  batch_size: 250
  flush_interval_s: 2

coverage:
  window_s: 1800
  bucket_s: 60

replay:
  default_speed: 10
  min_speed: 1
  max_speed: 60
  speed_steps: [1, 5, 10, 30, 60]
  queue_size: 8

# Research/demo thresholds, NOT official ATC separation standards.
risk:
  active_profile: research_default
  min_alert_level: MEDIUM
  allow_low_watch: false
  lookahead_s: 60
  max_data_age_for_alert_s: 75
  treat_unknown_vertical_as: conservative # conservative | skip | downgrade_one_level
  filters:
    ignore_both_on_ground: true
    ignore_diverging: true
    ignore_beyond_lookahead: true
    ignore_old_data: true
  confirmation:
    confirm_cycles: 2
    confirm_min_seconds: 30
  clear:
    clear_below_level: MEDIUM
    clear_cycles: 2
    clear_min_seconds: 30
  cooldown_s: 300
  data_lost_timeout_s: 90
  confidence:
    high_max_age_s: 15
    high_max_uncertainty_m: 250
    medium_max_age_s: 45
    medium_max_uncertainty_m: 750
  profiles:
    research_default:
      levels:
        LOW: {max_horizontal_separation_m: 3000, max_vertical_separation_m: 900, max_time_to_cpa_s: 120}
        MEDIUM: {max_horizontal_separation_m: 1852, max_vertical_separation_m: 600, max_time_to_cpa_s: 90}
        HIGH: {max_horizontal_separation_m: 926, max_vertical_separation_m: 300, max_time_to_cpa_s: 60}
        CRITICAL: {max_horizontal_separation_m: 463, max_vertical_separation_m: 150, max_time_to_cpa_s: 30}
      uncertainty_factor: 1.0
      adjustments:
        closing_speed_escalation_mps: 100
        closing_speed_raise_levels: 1
        poor_data_age_s: 60
        downgrade_poor_data: true
        poor_data_quality_flags: [LOW_QUALITY, stale_position, position_timestamp_missing]
      in_trail:
        enabled: true
        max_track_difference_deg: 20
        min_lateral_offset_m: 1500
        downgrade_levels: 1
    sensitive_test:
      levels:
        LOW: {max_horizontal_separation_m: 22000, max_vertical_separation_m: 12000, max_time_to_cpa_s: 120}
        MEDIUM: {max_horizontal_separation_m: 18000, max_vertical_separation_m: 10000, max_time_to_cpa_s: 120}
        HIGH: {max_horizontal_separation_m: 14000, max_vertical_separation_m: 8000, max_time_to_cpa_s: 90}
        CRITICAL: {max_horizontal_separation_m: 10000, max_vertical_separation_m: 6000, max_time_to_cpa_s: 60}
      uncertainty_factor: 0.0
      adjustments:
        closing_speed_escalation_mps: 80
        closing_speed_raise_levels: 1
        poor_data_age_s: 70
        downgrade_poor_data: false
        poor_data_quality_flags: [LOW_QUALITY, stale_position, position_timestamp_missing]
      in_trail:
        enabled: false
        max_track_difference_deg: 30
        min_lateral_offset_m: 1000
        downgrade_levels: 1

prediction:
  model: constant_velocity
  horizons_s: [5, 10, 20, 30, 60]
  ground_elevation_m: 16.4592
  max_data_age_s: 45
  skip_on_ground: true
  skip_low_quality: true
  skip_stale: true
  uncertainty:
    base_position_error_m: 30
    speed_error_mps: 1.5
    age_error_m_per_s: 0.5

cpa:
  lookahead_s: 60
  horizontal_cutoff_nm: 12
  altitude_band_ft: 5000
  relative_speed_epsilon_mps: 0.1
  position_epsilon_m: 0.01
  altitude_basis_policy: common_geometric_then_barometric
  minimum_data_quality: not_low_quality
  uncertainty_combination: root_sum_square
  display_near_nm: 1.5
  display_amber_nm: 3.0

api:
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

web:
  map_zoom: 9
  stale_after_s: 180
  altitude_bands_m:
    low_max: 304.8
    medium_max: 3048
  runway_ring_step_deg: 5
  age_refresh_s: 1
  reconnect_initial_ms: 1000
  reconnect_max_ms: 15000
  labels_min_zoom: 11
  label_exclusion_nm: 2
  prediction_ticks_min_zoom: 11
  trail_oldest_opacity: 0.18
  trail_newest_opacity: 0.82
